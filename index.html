<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FromBelgradeToBeijing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --text-light: #ecf0f1;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
        }

        /* Your existing styles */
        /* ... (keep all the navbar and existing styles) ... */

        /* Enhanced Modal Styles */
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .login-container>div {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-container form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .login-container input {
            padding: 0.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .login-container input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .login-container button[type="submit"] {
            background: var(--accent-color);
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-container button[type="submit"]:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }

        .close-login,
        .close-register {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--secondary-color);
            transition: color 0.3s ease;
        }

        .close-login:hover,
        .close-register:hover {
            color: var(--error-color);
        }

        /* Cart Styles */
        .cart-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: white;
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .cart-icon {
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cart-icon:hover {
            transform: scale(1.1);
        }

        .checkout-btn,
        .empty-cart-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .empty-cart-btn {
            background: var(--error-color);
            margin-left: 0.5rem;
        }

        .checkout-btn:hover,
        .empty-cart-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        /* Categories Section */
        .categories-section {
            padding: 2rem;
        }

        .categories {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <!-- Keep your existing body content -->

    <script>
        // Combine your scripts into one
        document.addEventListener("DOMContentLoaded", () => {
            startPanoramaSlideshow();
            setupUserInterface();
        });

        function setupUserInterface() {
            const currentUser = localStorage.getItem("currentUser");
            const isAdmin = JSON.parse(currentUser)?.isAdmin || false;

            // Update UI elements visibility
            updateUIVisibility(currentUser);

            // Setup modal handlers
            setupModalHandlers();
        }

        function updateUIVisibility(currentUser) {
            const elements = {
                loginBtn: document.getElementById("login-btn"),
                registerBtn: document.getElementById("register-btn"),
                logoutButton: document.getElementById("logout-button"),
                userAvatarDisplay: document.getElementById("user-avatar-display")
            };

            elements.loginBtn.style.display = currentUser ? "none" : "block";
            elements.registerBtn.style.display = currentUser ? "none" : "block";
            elements.logoutButton.style.display = currentUser ? "block" : "none";

            if (currentUser) {
                const isAdmin = JSON.parse(currentUser)?.isAdmin || false;
                elements.userAvatarDisplay.innerHTML = `
                    <img src="/images/avatar.jpg" alt="User Avatar">
                    ${isAdmin ? '<div class="admin-dropdown"><a href="/admin">Admin Panel</a></div>' : ''}
                `;
            }
        }

        function setupModalHandlers() {
            // Add modal open/close handlers
            const loginBtn = document.getElementById("login-btn");
            const registerBtn = document.getElementById("register-btn");
            const closeLogin = document.querySelector(".close-login");
            const closeRegister = document.querySelector(".close-register");

            loginBtn?.addEventListener("click", () => {
                document.getElementById("login").style.display = "flex";
            });

            registerBtn?.addEventListener("click", () => {
                document.getElementById("register").style.display = "flex";
            });

            closeLogin?.addEventListener("click", () => {
                document.getElementById("login").style.display = "none";
            });

            closeRegister?.addEventListener("click", () => {
                document.getElementById("register").style.display = "none";
            });
        }

        // Keep your existing functions
        function startPanoramaSlideshow() {
            // Your existing slideshow code
        }

        async function initiateCheckout() {
            // Your existing checkout code
        }

        function login(event) {
            // Your existing login code
        }

        function checkout() {
            // Your existing checkout code
        }
    </script>
</body>

</html>
