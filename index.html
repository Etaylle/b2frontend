<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FromBelgradeToBeijing</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    
    <script src="scripts/ProductGrid.js"></script>
    <script src="scripts/productGridInit.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body>
    <nav class="navbar">
        <!-- Panorama Container for Image Slider -->
        <div class="panorama-container">
            <img src="/images/belgrade-panorama-1.jpg" class="panorama-slide active" alt="Belgrade Panorama 1" />
            <img src="/images/belgrade-panorama-2.webp" class="panorama-slide" alt="Belgrade Panorama 2" />
            <img src="/images/belgrade-panorama-3.jpg" class="panorama-slide" alt="Belgrade Panorama 3" />
        </div>
        
        <!-- Navbar Content -->
        <div class="navbar-content">
            <!-- Logo -->
            <img src="/images/pobednik.jpg" class="logo animate__animated animate__fadeIn" alt="Logo" />
            <div class="user-section"></div>
                <div class="navbar-right">
                    <!-- Placeholder for future elements -->
                </div>
                <!-- Admin Link (Hidden by default) -->
                <a id="admin-link" href="/admin" class="admin-link" style="display:none" aria-label="Admin Panel">Admin Panel</a>
            
        </div>
            <!-- User Section -->
            <div class="user-section">
                <ul class="navbar-links">
                    <li><a href="#cart" aria-label="View Cart">Cart</a></li>
                    <a href="orderHistory.html" aria-label="Order History">Order History</a>
                    <li id="login-btn"><a href="#login" aria-label="Login">Login</a></li>
                    <li id="register-btn"><a href="#register" aria-label="Register">Register</a></li>
                    <li id="logout-button" style="display: none;"><a href="#logout" aria-label="Logout">Logout</a></li>
                </ul>
                
                <!-- User Avatar and Admin Dropdown (Visible only for admin) -->
                <div id="user-avatar-display" class="user-avatar-display">
                    <div class="admin-dropdown">
                        <a href="/admin" id="admin-link" aria-label="Admin Panel">Admin Panel</a>
                    </div>
                </div>
            </div>

   

    <!-- Navigation Links -->
    

          
    </nav>


    <main>
        <section id="auth-modal" class="auth-modal">
            <div class="auth-container">
                <button class="close-modal" aria-label="Close">&times;</button>
        
                <!-- Login Form -->
                <div id="login-form-container" class="form-container active">
                    <h2>Login</h2>
                    <form id="login-form" class="auth-form">
                        <div class="form-group">
                            <input type="email" id="login-email" required>
                            <label for="login-email">Email</label>
                            <span class="focus-border"></span>
                        </div>
        
                        <div class="form-group">
                            <input type="password" id="login-password" required>
                            <label for="login-password">Password</label>
                            <span class="focus-border"></span>
                        </div>
        
                        <button type="submit" class="submit-btn">
                            <span class="btn-text">Login</span>
                            <span class="spinner"></span>
                        </button>
        
                        <p class="switch-form-text">
                            Don't have an account?
                            <a href="#" id="switch-to-register">Register</a>
                        </p>
                    </form>
                    <div id="login-message" class="message"></div>
                </div>
        
                <!-- Register Form -->
                <div id="register-form-container" class="form-container">
                    <h2>Register</h2>
                    <form id="register-form" class="auth-form">
                        <div class="form-group">
                            <input type="text" id="register-username" required>
                            <label for="register-username">Username</label>
                            <span class="focus-border"></span>
                        </div>
        
                        <div class="form-row">
                            <div class="form-group">
                                <input type="text" id="register-firstname" required>
                                <label for="register-firstname">First Name</label>
                                <span class="focus-border"></span>
                            </div>
        
                            <div class="form-group">
                                <input type="text" id="register-lastname" required>
                                <label for="register-lastname">Last Name</label>
                                <span class="focus-border"></span>
                            </div>
                        </div>
        
                        <div class="form-group">
                            <input type="email" id="register-email" required>
                            <label for="register-email">Email</label>
                            <span class="focus-border"></span>
                        </div>
        
                        <div class="form-group">
                            <input type="password" id="register-password" required>
                            <label for="register-password">Password</label>
                            <span class="focus-border"></span>
                        </div>
        
                        <button type="submit" class="submit-btn">
                            <span class="btn-text">Register</span>
                            <span class="spinner"></span>
                        </button>
        
                        <p class="switch-form-text">
                            Already have an account?
                            <a href="#" id="switch-to-login">Login</a>
                        </p>
                    </form>
                    <div id="register-message" class="message"></div>
                </div>
            </div>
        </section>
        <!-- Search  -->
        <section id="search">
            <div class="search-container">
                <input type="text" id="product-search" placeholder="Please type to search products: by name, description, price..." aria-label="Search products">
            </div>
        </section>
        <section id="categories" class="categories-section">
            <div class="categories">
                <!-- Category buttons will be rendered here -->
            </div>
        </section>
        <section id="product-grid" class="grid-section">
            <div class="grid-container"></div>
        </section>
    
        <!-- Cart Section -->
        <section id="cart" class="cart-section">
            <div id="cart-container" class="cart-container">
                <img src="/images/cart.png" alt="Shopping Cart" class="cart-icon" />
    
                <ul id="cart-items"></ul>
                <p id="cart-total">Total: 0</p>
                <button onclick="checkout()" class="checkout-btn" aria-label="Proceed to checkout">Checkout</button>
                <button id="empty-cart-button" class="empty-cart-btn" aria-label="Empty the cart">Empty Cart</button>
            </div>
        </section>
    
        <!-- User Info Display -->
        <div id="user-info-display" style="display: none;"></div>
    
    
    
    </main>
    
    <!-- Scripts -->
    <script defer src="scripts/index.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            startPanoramaSlideshow();
            setupUserInterface();
            setupModalHandlers();
            

            const currentUser = localStorage.getItem("currentUser");
            const isAdmin = JSON.parse(currentUser)?.isAdmin || false;

            // Update UI elements visibility and user info
            updateUIVisibility(currentUser);
            

            // Stripe Checkout setup
            const stripe = Stripe('pk_test_51QZ5BBGhX6Xc3FUkDACPmuOMhQWtYAsoMwr3KMyH4XaJmEc7kYC5cZjWsuJX9ZeG36PXyjHAHFKpOnWvmYQKYScV00F3qNFmnl');
            const initiateCheckout = async () => {
                try {
                    const response = await fetch('/api/create-checkout-session', { method: 'POST' });
                    const data = await response.json();
                    const result = await stripe.redirectToCheckout({ sessionId: data.id });

                    if (result.error) {
                        console.error('Error:', result.error.message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            };
        });

        function setupUserInterface() {
            const currentUser = localStorage.getItem("currentUser");
            updateUIVisibility(currentUser);
        }

        function updateUIVisibility(currentUser) {
            const elements = {
                loginBtn: document.getElementById("login-btn"),
                registerBtn: document.getElementById("register-btn"),
                logoutButton: document.getElementById("logout-button"),
                userAvatarDisplay: document.getElementById("user-avatar-display")
            };

            elements.loginBtn.style.display = currentUser ? "none" : "block";
            elements.registerBtn.style.display = currentUser ? "none" : "block";
            elements.logoutButton.style.display = currentUser ? "block" : "none";

            if (currentUser) {
                const isAdmin = JSON.parse(currentUser)?.isAdmin || false;
                elements.userAvatarDisplay.innerHTML = `
                    <img src="/images/avatar.jpg" alt="User Avatar">
                    ${isAdmin ? '<div class="admin-dropdown"><a href="/admin">Admin Panel</a></div>' : ''}
                `;
            }
        }

        function setupModalHandlers() {
            const loginBtn = document.getElementById("login-btn");
            const registerBtn = document.getElementById("register-btn");
            const closeLogin = document.querySelector(".close-login");
            const closeRegister = document.querySelector(".close-register");

            loginBtn?.addEventListener("click", () => document.getElementById("login").style.display = "flex");
            registerBtn?.addEventListener("click", () => document.getElementById("register").style.display = "flex");
            closeLogin?.addEventListener("click", () => document.getElementById("login").style.display = "none");
            closeRegister?.addEventListener("click", () => document.getElementById("register").style.display = "none");
        }

        function startPanoramaSlideshow() {
            const slides = document.querySelectorAll('.panorama-slide');
            let currentSlide = 0;

            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 5000);
        }

        // Enhanced form handling
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const messageDiv = document.getElementById('login-message');

            try {
                setLoading(form, true);
                await new Promise(resolve => setTimeout(resolve, 1500));

                const success = await login();
                if (success) {
                    showMessage(messageDiv, 'Login successful!', 'success');
                    setTimeout(() => document.getElementById('login').style.display = 'none', 1000);
                } else {
                    showMessage(messageDiv, 'Invalid credentials', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'An error occurred', 'error');
            } finally {
                setLoading(form, false);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const form = event.target;
            const messageDiv = document.getElementById('register-message');

            try {
                setLoading(form, true);
                await new Promise(resolve => setTimeout(resolve, 1500));

                const success = await register();
                if (success) {
                    showMessage(messageDiv, 'Registration successful!', 'success');
                    setTimeout(() => document.getElementById('register').style.display = 'none', 1000);
                } else {
                    showMessage(messageDiv, 'Registration failed', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'An error occurred', 'error');
            } finally {
                setLoading(form, false);
            }
        }

        function setLoading(form, isLoading) {
            form.classList.toggle('loading', isLoading);
        }

        function showMessage(element, message, type) {
            element.className = `message ${type}`;
            element.textContent = message;
        }

        // Cart animations
        function updateCart(item) {
            const cartItems = document.getElementById('cart-items');
            const li = document.createElement('li');
            li.className = 'cart-item';
            li.textContent = item.name;
            cartItems.appendChild(li);
            updateCartBadge();
        }

        function removeFromCart(item) {
            const cartItem = item.parentElement;
            cartItem.classList.add('removing');
            setTimeout(() => {
                cartItem.remove();
                updateCartBadge();
            }, 300);
        }

        function updateCartBadge() {
            const cartItems = document.getElementById('cart-items').children.length;
            const badge = document.querySelector('.cart-badge');

            if (cartItems > 0) {
                if (!badge) {
                    const newBadge = document.createElement('div');
                    newBadge.className = 'cart-badge';
                    newBadge.textContent = cartItems;
                    document.querySelector('.cart-icon-wrapper').appendChild(newBadge);
                } else {
                    badge.textContent = cartItems;
                }
            } else if (badge) {
                badge.remove();
            }
        }
    document.addEventListener("DOMContentLoaded", () => {
        // Get all category buttons
        const categoryButtons = document.querySelectorAll('.category-btn');

        // Add click event listener to each button
        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove 'selected' class from all buttons
                categoryButtons.forEach(btn => btn.classList.remove('selected'));

                // Add 'selected' class to the clicked button
                button.classList.add('selected');
            });
        });
    });
        
    </script>
</body>

</html>
