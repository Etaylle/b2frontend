    <script>
        document.addEventListener("DOMContentLoaded", () => {
            startPanoramaSlideshow();
            setupUserInterface();
            setupModalHandlers();
            const chat = new ChatWidget();
            chat.loadMessages()
            

            const currentUser = localStorage.getItem("currentUser");
            const isAdmin = JSON.parse(currentUser)?.isAdmin || false;

            // Update UI elements visibility and user info
            updateUIVisibility(currentUser);
            

            // Stripe Checkout setup
            const stripe = Stripe('pk_test_51QZ5BBGhX6Xc3FUkDACPmuOMhQWtYAsoMwr3KMyH4XaJmEc7kYC5cZjWsuJX9ZeG36PXyjHAHFKpOnWvmYQKYScV00F3qNFmnl');
            const initiateCheckout = async () => {
                try {
                    const response = await fetch('/api/create-checkout-session', { method: 'POST' });
                    const data = await response.json();
                    const result = await stripe.redirectToCheckout({ sessionId: data.id });

                    if (result.error) {
                        console.error('Error:', result.error.message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            };
        });

        function setupUserInterface() {
            const currentUser = localStorage.getItem("currentUser");
            updateUIVisibility(currentUser);
        }

        function updateUIVisibility(currentUser) {
            const elements = {
                loginBtn: document.getElementById("login-btn"),
                registerBtn: document.getElementById("register-btn"),
                logoutButton: document.getElementById("logout-button"),
                userAvatarDisplay: document.getElementById("user-avatar-display")
            };

            elements.loginBtn.style.display = currentUser ? "none" : "block";
            elements.registerBtn.style.display = currentUser ? "none" : "block";
            elements.logoutButton.style.display = currentUser ? "block" : "none";

            if (currentUser) {
                const isAdmin = JSON.parse(currentUser)?.isAdmin || false;
                elements.userAvatarDisplay.innerHTML = `
                    <img src="/images/avatar.jpg" alt="User Avatar">
                    ${isAdmin ? '<div class="admin-dropdown"><a href="/admin">Admin Panel</a></div>' : ''}
                `;
            }
        }

        function setupModalHandlers() {
            const loginBtn = document.getElementById("login-btn");
            const registerBtn = document.getElementById("register-btn");
            const closeLogin = document.querySelector(".close-login");
            const closeRegister = document.querySelector(".close-register");

            loginBtn?.addEventListener("click", () => document.getElementById("login").style.display = "flex");
            registerBtn?.addEventListener("click", () => document.getElementById("register").style.display = "flex");
            closeLogin?.addEventListener("click", () => document.getElementById("login").style.display = "none");
            closeRegister?.addEventListener("click", () => document.getElementById("register").style.display = "none");
        }

        function startPanoramaSlideshow() {
            const slides = document.querySelectorAll('.panorama-slide');
            let currentSlide = 0;

            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 5000);
        }

        // Enhanced form handling
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const messageDiv = document.getElementById('login-message');

            try {
                setLoading(form, true);
                await new Promise(resolve => setTimeout(resolve, 1500));

                const success = await login();
                if (success) {
                    showMessage(messageDiv, 'Login successful!', 'success');
                    setTimeout(() => document.getElementById('login').style.display = 'none', 1000);
                } else {
                    showMessage(messageDiv, 'Invalid credentials', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'An error occurred', 'error');
            } finally {
                setLoading(form, false);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const form = event.target;
            const messageDiv = document.getElementById('register-message');

            try {
                setLoading(form, true);
                await new Promise(resolve => setTimeout(resolve, 1500));

                const success = await register();
                if (success) {
                    showMessage(messageDiv, 'Registration successful!', 'success');
                    setTimeout(() => document.getElementById('register').style.display = 'none', 1000);
                } else {
                    showMessage(messageDiv, 'Registration failed', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'An error occurred', 'error');
            } finally {
                setLoading(form, false);
            }
        }

        function setLoading(form, isLoading) {
            form.classList.toggle('loading', isLoading);
        }

        function showMessage(element, message, type) {
            element.className = `message ${type}`;
            element.textContent = message;
        }

        // Cart animations
        function updateCart(item) {
            const cartItems = document.getElementById('cart-items');
            const li = document.createElement('li');
            li.className = 'cart-item';
            li.textContent = item.name;
            cartItems.appendChild(li);
            updateCartBadge();
        }

        function removeFromCart(item) {
            const cartItem = item.parentElement;
            cartItem.classList.add('removing');
            setTimeout(() => {
                cartItem.remove();
                updateCartBadge();
            }, 300);
        }

        function updateCartBadge() {
            const cartItems = document.getElementById('cart-items').children.length;
            const badge = document.querySelector('.cart-badge');

            if (cartItems > 0) {
                if (!badge) {
                    const newBadge = document.createElement('div');
                    newBadge.className = 'cart-badge';
                    newBadge.textContent = cartItems;
                    document.querySelector('.cart-icon-wrapper').appendChild(newBadge);
                } else {
                    badge.textContent = cartItems;
                }
            } else if (badge) {
                badge.remove();
            }
        }
    document.addEventListener("DOMContentLoaded", () => {
        // Get all category buttons
        const categoryButtons = document.querySelectorAll('.category-btn');

        // Add click event listener to each button
        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove 'selected' class from all buttons
                categoryButtons.forEach(btn => btn.classList.remove('selected'));

                // Add 'selected' class to the clicked button
                button.classList.add('selected');

            constructor() {
                this.initializeElements();
                this.bindEvents();
                this.messages = [];

            }

                this.chatToggle = document.getElementById('chat-toggle');

                this.chatForm = document.getElementById('chat-form');
                this.chatInput = document.getElementById('chat-input');
                this.minimizeButton = document.getElementById('minimize-chat');
                this.closeButton = document.getElementById('close-chat');
            }

            addStyles() {
                const styles = `
            .message {
                max-width: 80%;
                margin: 8px;
                padding: 12px;
                border-radius: 15px;
                position: relative;
                animation: messageSlide 0.3s ease-out;
                clear: both;
                word-wrap: break-word;
            }

            .message.user {
                background-color: #007bff;
                color: white;
                float: right;
                border-bottom-right-radius: 5px;
            }

            .message.support {
                background-color: #f0f0f0;
                color: #333;
                float: left;
                border-bottom-left-radius: 5px;
            }

            .message-time {
                font-size: 0.7em;
                opacity: 0.7;
                margin-top: 5px;
                display: block;
            }

            @keyframes messageSlide {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .chat-messages {
                height: 300px;
                overflow-y: auto;
                padding: 10px;
                background: white;
            }

            .message-animation {
                animation: messageSlide 0.3s ease-out;
            }

            .chat-window.minimized {
                height: 40px;
                overflow: hidden;
            }
        `;

                const styleSheet = document.createElement("style");
                styleSheet.textContent = styles;
                document.head.appendChild(styleSheet);
            }

            bindEvents() {
                this.chatToggle.addEventListener('click', () => this.toggleChat());
                this.chatForm.addEventListener('submit', (e) => this.handleSubmit(e));
                this.minimizeButton.addEventListener('click', () => this.minimizeChat());
                this.closeButton.addEventListener('click', () => this.closeChat());
            }

            toggleChat() {
                this.isVisible = !this.isVisible;  // Toggle visibility state
                this.chatWindow.style.display = this.isVisible ? 'flex' : 'none';
                this.chatToggle.style.display = this.isVisible ? 'none' : 'flex';

                if (this.isVisible && this.messages.length === 0) {
                    this.addMessage('Hello! How can I help you today?', 'support');
                } else if (!this.isVisible) {
                    // Optionally, clear the messages from the DOM when closing, but keep them in memory
                    while (this.chatMessages.firstChild) {
                        this.chatMessages.removeChild(this.chatMessages.firstChild);
                    }
                }
            }

            minimizeChat() {
                this.isMinimized = !this.isMinimized;
                this.chatWindow.classList.toggle('minimized');
                this.minimizeButton.querySelector('i').classList.toggle('fa-minus');
                this.minimizeButton.querySelector('i').classList.toggle('fa-plus');
            }

            closeChat() {
                this.chatWindow.style.display = 'none';
                this.chatToggle.style.display = 'flex';
            }

            handleSubmit(e) {
                e.preventDefault();
                const message = this.chatInput.value.trim();
                if (!message) return;

                this.addMessage(message, 'user');
                this.chatInput.value = '';

                // Simulate automated responses based on keywords
                setTimeout(() => {
                    const response = this.getAutomatedResponse(message.toLowerCase());
                    this.addMessage(response, 'support');
                }, 1000);
            }

            getAutomatedResponse(message) {
                const responses = {
                    'hello': 'Hi there! How can I assist you today?',
                    'hi': 'Hello! How may I help you?',
                    'price': 'Our prices vary by product. Is there a specific item you\'re interested in?',
                    'shipping': 'We offer standard shipping (3-5 days) and express shipping (1-2 days). Would you like more details?',
                    'return': 'Our return policy allows returns within 30 days of purchase. Would you like more information?',
                    'help': 'I\'d be happy to help! What do you need assistance with?',
                    'default': 'Thank you for your message. How else can I assist you?'
                };

                for (const [key, response] of Object.entries(responses)) {
                    if (message.includes(key)) {
                        return response;
                    }
                }

                return responses.default;
            }

            addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', sender, 'message-animation');

                const messageText = document.createElement('span');
                messageText.textContent = text;

                const timeSpan = document.createElement('span');
                timeSpan.classList.add('message-time');
                timeSpan.textContent = new Date().toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                messageDiv.appendChild(messageText);
                messageDiv.appendChild(timeSpan);

                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
                this.messages.push({ text, sender, time: new Date() });

                // Save messages to localStorage
                this.saveMessages();
            }

            saveMessages() {
                localStorage.setItem('chatMessages', JSON.stringify(this.messages));
            }

            loadMessages() {
                const savedMessages = localStorage.getItem('chatMessages');
                if (savedMessages) {
                    const messages = JSON.parse(savedMessages);
                    messages.forEach(msg => this.addMessage(msg.text, msg.sender));
                }
            }

            scrollToBottom() {
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }
        }
