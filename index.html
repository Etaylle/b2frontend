<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="From Belgrade To Beijing - Shop our unique collection of products" />
    <title>FromBelgradeToBeijing</title>

    <!-- Consolidated CSS imports -->
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Preload critical assets -->
    <link rel="preload" href="/images/belgrade-panorama-1.jpg" as="image" />
    <link rel="preload" href="/images/pobednik.jpg" as="image" />

    <!-- Defer non-critical scripts -->
    <script defer src="scripts/ProductGrid.js"></script>
    <script defer src="scripts/productGridInit.js"></script>
    <script defer src="scripts/index.js"></script>

    <!-- External dependencies -->
    <script defer src="https://js.stripe.com/v3/"></script>
    <script defer src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script defer src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <script defer src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header>
        <nav class="navbar" aria-label="Main navigation">
            <!-- Panorama Container -->
            <div class="panorama-container" aria-label="Belgrade panorama slideshow">
                <img src="/images/belgrade-panorama-1.jpg" class="panorama-slide active" alt="Belgrade cityscape view 1"
                    loading="lazy" />
                <img src="/images/belgrade-panorama-2.webp" class="panorama-slide" alt="Belgrade cityscape view 2"
                    loading="lazy" />
                <img src="/images/belgrade-panorama-3.jpg" class="panorama-slide" alt="Belgrade cityscape view 3"
                    loading="lazy" />
            </div>

            <div class="navbar-content">
                <a href="/" class="logo-link">
                    <img src="/images/pobednik.jpg" class="logo animate__animated animate__fadeIn"
                        alt="From Belgrade To Beijing Logo" width="150" height="50" />
                </a>

                <div class="nav-controls">
                    <nav class="user-navigation" aria-label="User navigation">
                        <ul class="navbar-links">
                            <li><a href="orderHistory.html" aria-label="View order history">Order History</a></li>
                            <li><a href="#cart" aria-label="View shopping cart">Cart <span class="cart-count"
                                        aria-live="polite"></span></a></li>
                            <li id="login-btn"><button type="button" aria-label="Open login form">Login</button></li>
                            <li id="register-btn"><button type="button"
                                    aria-label="Open registration form">Register</button></li>
                            <li id="logout-button" hidden><button type="button" aria-label="Logout">Logout</button></li>
                        </ul>
                    </nav>

                    <div class="user-controls">
                        <div id="user-avatar-display" class="user-avatar-display" hidden>
                            <img src="/images/avatar.jpg" alt="User profile picture" width="40" height="40" />
                            <div class="admin-dropdown" hidden>
                                <a href="/admin" id="admin-link">Admin Panel</a>
                            </div>
                        </div>

                        <div class="crypto-toggle-container">
                            <label class="crypto-switch" for="crypto-toggle">
                                <input type="checkbox" id="crypto-toggle" aria-label="Toggle cryptocurrency prices">
                                <span class="slider round"></span>
                                <span class="crypto-label">Show Crypto Prices</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Auth Forms -->
        <div id="auth-forms">
            <dialog id="login-dialog" class="login-container">
                <div class="dialog-content">
                    <button type="button" class="close-login" aria-label="Close login form">×</button>
                    <h2>Login</h2>
                    <form id="login-form" method="dialog">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required autocomplete="email" />
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" required autocomplete="current-password" />
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="submit-btn">
                                <span>Login</span>
                                <span class="spinner" hidden></span>
                            </button>
                        </div>
                        <div id="login-message" role="alert"></div>
                    </form>
                </div>
            </dialog>

            <dialog id="register-dialog" class="login-container">
                <div class="dialog-content">
                    <button type="button" class="close-register" aria-label="Close registration form">×</button>
                    <h2>Register</h2>
                    <form id="register-form" method="dialog">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" required autocomplete="username" />
                        </div>
                        <div class="form-group">
                            <label for="firstname">First Name</label>
                            <input type="text" id="firstname" required autocomplete="given-name" />
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastname" required autocomplete="family-name" />
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" required autocomplete="email" />
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" required autocomplete="new-password" />
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="submit-btn">
                                <span>Register</span>
                                <span class="spinner" hidden></span>
                            </button>
                        </div>
                        <div id="register-message" role="alert"></div>
                    </form>
                </div>
            </dialog>
        </div>

        <!-- Search Section -->
        <section aria-label="Product search">
            <div class="search-container">
                <label for="product-search" class="visually-hidden">Search products</label>
                <input type="search" id="product-search" placeholder="Search products by name, description, or price..."
                    aria-label="Search products">
            </div>
        </section>

        <!-- Categories Section -->
        <section id="categories" class="categories-section" aria-label="Product categories">
            <div class="categories-container"></div>
        </section>

        <!-- Product Grid -->
        <section id="grid" class="grid-section" aria-label="Product grid">
            <div id="product-grid-root"></div>
        </section>

        <!-- Shopping Cart -->
        <section id="cart" class="cart-section" aria-label="Shopping cart">
            <div id="cart-container" class="cart-container">
                <h2>Shopping Cart</h2>
                <img src="/images/cart.png" alt="" class="cart-icon" width="32" height="32" />
                <ul id="cart-items" aria-label="Cart items"></ul>
                <p id="cart-total" aria-live="polite">Total: 0</p>
                <div class="cart-actions">
                    <button type="button" onclick="checkout()" class="checkout-btn">Checkout</button>
                    <button type="button" id="empty-cart-button" class="empty-cart-btn">Empty Cart</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Initialize Stripe
        let stripe;

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                stripe = Stripe('pk_test_51QZ5BBGhX6Xc3FUkDACPmuOMhQWtYAsoMwr3KMyH4XaJmEc7kYC5cZjWsuJX9ZeG36PXyjHAHFKpOnWvmYQKYScV00F3qNFmnl');

                initializeUI();
                startPanoramaSlideshow();
                setupEventListeners();
                await loadUserState();

            } catch (error) {
                console.error('Initialization error:', error);
            }
        });

        function initializeUI() {
            const loginDialog = document.getElementById('login-dialog');
            const registerDialog = document.getElementById('register-dialog');

            // Initialize dialogs if browser doesn't support <dialog>
            if (!loginDialog.showModal) {
                dialogPolyfill.registerDialog(loginDialog);
                dialogPolyfill.registerDialog(registerDialog);
            }
        }

        function setupEventListeners() {
            // Auth related listeners
            document.getElementById('login-btn').addEventListener('click', () => {
                document.getElementById('login-dialog').showModal();
            });

            document.getElementById('register-btn').addEventListener('click', () => {
                document.getElementById('register-dialog').showModal();
            });

            // Form submissions
            document.getElementById('login-form').addEventListener('submit', handleLogin);
            document.getElementById('register-form').addEventListener('submit', handleRegister);

            // Close dialog buttons
            document.querySelectorAll('.close-login, .close-register').forEach(button => {
                button.addEventListener('click', (e) => {
                    e.target.closest('dialog').close();
                });
            });

            // Category buttons
            document.querySelectorAll('.category-btn').forEach(button => {
                button.addEventListener('click', handleCategorySelect);
            });
        }

        async function loadUserState() {
            try {
                const currentUser = localStorage.getItem("currentUser");
                if (currentUser) {
                    const userData = JSON.parse(currentUser);
                    updateUIForUser(userData);
                }
            } catch (error) {
                console.error('Error loading user state:', error);
            }
        }

        function updateUIForUser(userData) {
            const elements = {
                loginBtn: document.getElementById("login-btn"),
                registerBtn: document.getElementById("register-btn"),
                logoutButton: document.getElementById("logout-button"),
                userAvatarDisplay: document.getElementById("user-avatar-display"),
                adminPanel: document.querySelector(".admin-dropdown")
            };

            elements.loginBtn.hidden = true;
            elements.registerBtn.hidden = true;
            elements.logoutButton.hidden = false;
            elements.userAvatarDisplay.hidden = false;

            if (userData.isAdmin) {
                elements.adminPanel.hidden = false;
            }
        }

        function startPanoramaSlideshow() {
            const slides = document.querySelectorAll('.panorama-slide');
            let currentSlide = 0;
            let intervalId;

            function showSlide(index) {
                slides.forEach(slide => slide.classList.remove('active'));
                slides[index].classList.add('active');
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % slides.length;
                showSlide(currentSlide);
            }

            // Start slideshow
            intervalId = setInterval(nextSlide, 5000);

            // Pause on visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    clearInterval(intervalId);
                } else {
                    intervalId = setInterval(nextSlide, 5000);
                }
            });
        }

        async function handleCheckout() {
            try {
                const response = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Checkout session creation failed');
                }

                const { id: sessionId } = await response.json();
                const { error } = await stripe.redirectToCheckout({ sessionId });

                if (error) {
                    throw error;
                }
            } catch (error) {
                console.error('Checkout error:', error);
                alert('Unable to proceed with checkout. Please try again later.');
            }
        }
    </script>
</body>

</html>
