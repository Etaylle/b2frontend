<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FromBelgradeToBeijing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --text-light: #ecf0f1;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            position: relative;
            height: 280px;
            overflow: hidden;
            background: var(--primary-color);
        }

        .navbar-content {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 1rem;
            background: rgba(44, 62, 80, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .panorama-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .panorama-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            object-fit: cover;
        }

        .panorama-slide.active {
            opacity: 1;
        }

        .logo {
            height: 50px;
            width: auto;
            margin-right: 1rem;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar-display {
            position: relative;
            cursor: pointer;
        }

        .user-avatar-display img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            transition: transform 0.3s ease;
        }

        .user-avatar-display:hover img {
            transform: scale(1.1);
        }

        .admin-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 0.5rem;
            display: none;
        }

        .user-avatar-display:hover .admin-dropdown {
            display: block;
        }

        .navbar ul {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navbar ul li {
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .navbar ul li:hover {
            color: var(--accent-color);
        }

        .navbar a {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .navbar a:hover {
            color: var(--accent-color);
        }

        /* Enhanced styling for other sections */
        .search-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        #product-search {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        #product-search:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
    </style>
    <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
    <nav class="navbar">
        <div class="panorama-container">
            <img src="/images/belgrade-panorama-1.jpg" class="panorama-slide active" alt="Belgrade Panorama 1" />
            <img src="/images/belgrade-panorama-2.webp" class="panorama-slide" alt="Belgrade Panorama 2" />
            <img src="/images/belgrade-panorama-3.jpg" class="panorama-slide" alt="Belgrade Panorama 3" />
        </div>
        <div class="navbar-content">
            <img src='/images/pobednik.jpg' class="logo animate__animated animate__fadeIn" alt="Logo" />
            <div class="user-section">
                <ul>
                    <li><a href="#grid">Home</a></li>
                    <li id="login-btn">Login</li>
                    <li id="register-btn">Register</li>
                    <li id="logout-button" style="display: none;">Logout</li>
                </ul>
                <div id="user-avatar-display" class="user-avatar-display">
                    <div class="admin-dropdown">
                        <a href="/admin" id="admin-link">Admin Panel</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <!-- Login Section -->
        <section id="login" class="login-container" style="display: none;">
            <div>
                <button class="close-login" aria-label="Close login form">x</button>
                <h2>Login</h2>
                <form id="login-form" onsubmit="login(event)">
                    <input type="email" id="email" placeholder="Email" required />
                    <input type="password" id="password" placeholder="Password" required />
                    <button type="submit">Login</button>
                </form>
                <p id="login-status"></p>
            </div>
        </section>
        <!-- Register Section -->
        <section id="register" class="login-container" style="display: none;">
            <div id="register" class="modal">
                <button class="close-register" aria-label="Close login form">x</button>
                <h2>Register</h2>
                <form id="register-form">
                    <input type="text" id="username" placeholder="Username" required />
                    <input type="text" id="firstname" placeholder="First Name" required />
                    <input type="text" id="lastname" placeholder="Last Name" required />
                    <input type="email" id="reg-email" placeholder="Email" required />
                    <input type="password" id="reg-password" placeholder="Password" required />
                    <button type="submit">Register</button>
                </form>
                <p id="register-status"></p>
            </div>
        </section>
        <!-- Search  -->
        <section id="search">
            <div class="search-container">
                <input type="text" id="product-search" placeholder="Search products by name, description, or price..."
                    aria-label="Search products">
            </div>
        </section>
        <section id="categories" class="categories-section">
            <div class="categories
            <div class=" categories">
                <!-- Category buttons will be rendered here -->
            </div>
            <div class="grid-container">
                <!-- Products will be rendered here -->
            </div>
        </section>
        <!-- Grid Section -->
        <section id="grid" class="grid-section">
            <div class="grid-container"></div>
        </section>
    
        <!-- Cart Section -->
        <section id="cart" class="cart-section">
            <div id="cart-container" class="cart-container">
                <img src="/images/cart.png" alt="Shopping Cart" class="cart-icon" />
    
                <ul id="cart-items"></ul>
                <p id="cart-total">Total: 0</p>
                <button onclick="checkout()" class="checkout-btn" aria-label="Proceed to checkout">Checkout</button>
                <button id="empty-cart-button" class="empty-cart-btn" aria-label="Empty the cart">Empty Cart</button>
            </div>
        </section>
    
        <!-- User Info Display -->
        <div id="user-info-display" style="display: none;"></div>
    
    
    
    </main>
    
    <!-- Scripts -->
    <script defer src="scripts/index.js"></script>
    
    <script>

            const currentUser = localStorage.getItem("currentUser");
            document.getElementById("login-btn").style.display = currentUser ? "none" : "block";
            document.getElementById("register-btn").style.display = currentUser ? "none" : "block";
            document.getElementById("logout-button").style.display = currentUser ? "block" : "none";

            // Show/hide user info
            const userAvatarDisplay = document.getElementById("user-avatar-display");
            if (currentUser) {
                userAvatarDisplay.innerHTML = `<img src="path/to/avatar.jpg" alt="User Avatar">`;
            }
        });
        const stripe = Stripe('pk_test_51QZ5BBGhX6Xc3FUkDACPmuOMhQWtYAsoMwr3KMyH4XaJmEc7kYC5cZjWsuJX9ZeG36PXyjHAHFKpOnWvmYQKYScV00F3qNFmnl');
        async function initiateCheckout() {
            try {
                const response = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    // Add your request headers and body if needed

                // Redirect to Stripe Checkout
                const result = await stripe.redirectToCheckout({ sessionId: data.id });

                if (result.error) {
                    console.error('Error:', result.error.message);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function login(event) {
            event.preventDefault();
            // Perform login logic here
        }

        function checkout() {
            // Perform checkout logic here
        }
    </script>

    <script>
        // Panorama slideshow
        function startPanoramaSlideshow() {
            const slides = document.querySelectorAll('.panorama-slide');
            let currentSlide = 0;

            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 5000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            startPanoramaSlideshow();

            const currentUser = localStorage.getItem("currentUser");
            const isAdmin = JSON.parse(currentUser)?.isAdmin || false;

            document.getElementById("login-btn").style.display = currentUser ? "none" : "block";
            document.getElementById("register-btn").style.display = currentUser ? "none" : "block";
            document.getElementById("logout-button").style.display = currentUser ? "block" : "none";

            // Show/hide user info and admin link
            const userAvatarDisplay = document.getElementById("user-avatar-display");
            const adminLink = document.getElementById("admin-link");

            if (currentUser) {
                userAvatarDisplay.innerHTML = `
                    <img src="/images/avatar.jpg" alt="User Avatar">
                    ${isAdmin ? '<div class="admin-dropdown"><a href="/admin">Admin Panel</a></div>' : ''}
                `;
            }
        });
    </script>
</body>

</html>
