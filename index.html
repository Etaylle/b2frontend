    <style>
        /* Keep existing root variables and base styles */

        /* Loading Spinner */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--text-light);
            border-bottom-color: transparent;
            border-radius: 50%;
            display: none;
            animation: rotation 1s linear infinite;
            margin: 0 auto;
        }

        .loading .spinner {
            display: inline-block;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Button Loading State */
        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .loading .btn-content span {
            display: none;
        }

        .loading .btn-content .spinner {
            display: inline-block;
        }

        /* Form Loading Overlay */
        .form-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }

        .loading .form-overlay {
            display: flex;
        }

        /* Cart Animations */
        .cart-item {
            animation: slideInRight 0.3s ease-out;
        }

        .cart-item.removing {
            animation: slideOutRight 0.3s ease-out forwards;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* Cart Badge */
        .cart-icon-wrapper {
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-color);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }

            80% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Enhanced Form Styles */
        .login-container form,
        #register-form {
            position: relative;
        }

        .form-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .form-group label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.3s ease;
            pointer-events: none;
            color: #666;
        }

        .form-group input:focus+label,
        .form-group input:not(:placeholder-shown)+label {
            top: 0;
            font-size: 0.8rem;
            background: white;
            padding: 0 4px;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 0.8rem;
        }

        /* Success/Error Messages */
        .message {
            padding: 0.8rem;
            border-radius: 6px;
            margin-top: 1rem;
            animation: slideDown 0.3s ease-out;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

    <script>
        // Panorama slideshow
        function startPanoramaSlideshow() {
            const slides = document.querySelectorAll('.panorama-slide');
            let currentSlide = 0;

            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 5000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            startPanoramaSlideshow();

            const currentUser = localStorage.getItem("currentUser");
            const isAdmin = JSON.parse(currentUser)?.isAdmin || false;

            document.getElementById("login-btn").style.display = currentUser ? "none" : "block";
            document.getElementById("register-btn").style.display = currentUser ? "none" : "block";
            document.getElementById("logout-button").style.display = currentUser ? "block" : "none";

            // Show/hide user info and admin link
            const userAvatarDisplay = document.getElementById("user-avatar-display");
            const adminLink = document.getElementById("admin-link");

            if (currentUser) {
                userAvatarDisplay.innerHTML = `
                        <img src="/images/avatar.jpg" alt="User Avatar">
                        ${isAdmin ? '<div class="admin-dropdown"><a href="/admin">Admin Panel</a></div>' : ''}
                    `;
            }
        });
    
        // Enhanced form handling
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const messageDiv = document.getElementById('login-message');

            try {
                setLoading(form, true);

                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Your actual login logic here
                const success = await login();

                if (success) {
                    showMessage(messageDiv, 'Login successful!', 'success');
                    setTimeout(() => {
                        document.getElementById('login').style.display = 'none';
                    }, 1000);
                } else {
                    showMessage(messageDiv, 'Invalid credentials', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'An error occurred', 'error');
            } finally {
                setLoading(form, false);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const form = event.target;
            const messageDiv = document.getElementById('register-message');

            try {
                setLoading(form, true);

                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Your actual register logic here
                const success = await register();

                if (success) {
                    showMessage(messageDiv, 'Registration successful!', 'success');
                    setTimeout(() => {
                        document.getElementById('register').style.display = 'none';
                    }, 1000);
                } else {
                    showMessage(messageDiv, 'Registration failed', 'error');
                }
            } catch (error) {
                showMessage(messageDiv, 'An error occurred', 'error');
            } finally {
                setLoading(form, false);
            }
        }

        function setLoading(form, isLoading) {
            form.classList.toggle('loading', isLoading);
        }

        function showMessage(element, message, type) {
            element.className = `message ${type}`;
            element.textContent = message;
        }

        // Cart animations
        function updateCart(item) {
            const cartItems = document.getElementById('cart-items');
            const li = document.createElement('li');
            li.className = 'cart-item';
            li.textContent = item.name;
            cartItems.appendChild(li);

            updateCartBadge();
        }

        function removeFromCart(item) {
            const cartItem = item.parentElement;
            cartItem.classList.add('removing');
            setTimeout(() => {
                cartItem.remove();
                updateCartBadge();
            }, 300);
        }

        function updateCartBadge() {
            const cartItems = document.getElementById('cart-items').children.length;
            const badge = document.querySelector('.cart-badge');

            if (cartItems > 0) {
                if (!badge) {
                    const newBadge = document.createElement('div');
                    newBadge.className = 'cart-badge';
                    newBadge.textContent = cartItems;
                    document.querySelector('.cart-icon-wrapper').appendChild(newBadge);
                } else {
                    badge.textContent = cartItems;
                }
            } else if (badge) {
                badge.remove();
            }
        }
 
        // Keep your existing event listeners and initialization code
    </script>
